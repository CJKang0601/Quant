name: Daily Analysis Update

on:
  schedule:
    - cron: '0 0 * * *'  # 每天午夜執行
  workflow_dispatch:      # 允許手動執行

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 允許 Actions 推送代碼更新到倉庫
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run update script
      env:
        OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python update_all_sources.py
        python generate_static_site.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        mkdir -p data/processed docs
        git add -f data/processed/analysis_*.json docs/index.html
        git commit -m "chore: auto-update analysis data [skip ci]" || echo "No changes to commit"
        git push
